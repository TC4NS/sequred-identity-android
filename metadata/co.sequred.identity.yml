# F-Droid metadata for SeQured Identity (Android).
#
# This file is the template you copy into your fdroiddata fork at
# metadata/co.sequred.identity.yml. F-Droid's build server reads this to
# pull the source, compile the Rust core + Android app from scratch, and
# sign with their own key.
#
# Spec reference: https://f-droid.org/en/docs/Build_Metadata_Reference/

Categories:
  - Security
  - System

License: MPL-2.0
AuthorName: Tucker Nelson
AuthorEmail: tucker@sequred.co
WebSite: https://sequred.co
SourceCode: https://github.com/TC4NS/sequred-identity-android
IssueTracker: https://github.com/TC4NS/sequred-identity-android/issues

AutoName: SeQured Identity
Summary: Stateless deterministic password manager

Description: |-
    SeQured Identity is a stateless deterministic password manager.

    Instead of storing your passwords, the app derives them on demand from
    four factors you provide:

    * a master password
    * a 6+ digit PIN
    * the site name
    * your username (or email)

    The same four inputs always produce the same password, on any device,
    with no servers involved. A small encrypted vault on the device stores
    credential metadata + optional TOTP seeds — never the passwords
    themselves.

    Features:

    * Stateless derivation via Argon2id + PBKDF2-HMAC-SHA3-256
    * Encrypted vault (Argon2id 64 MiB / 3 iters → AES-256-GCM) with
      automatic upgrade migrations
    * Biometric unlock backed by the Android Keystore
    * Built-in TOTP authenticator with QR scanner
    * Autofill service that derives + fills passwords from any login form
      (prompt-every-time security model — master never cached)
    * Import from Bitwarden / LastPass / 1Password / Chrome / KeePass / CSV
    * Encrypted export interchangeable with the iOS app
    * Zero network calls. No analytics. No tracking. No ads.

    The Camera permission is used solely for the in-app QR scanner that
    imports otpauth:// TOTP secrets.

RepoType: git
Repo: https://github.com/TC4NS/sequred-identity-android.git

Builds:
  - versionName: 0.1.0
    versionCode: 10000
    commit: v0.1.0
    subdir: app
    sudo:
      # Install Rust + cargo-ndk so we can rebuild the libsequred_core.so
      # binaries from source (they aren't checked into git per F-Droid's
      # source-only policy).
      - apt-get update
      - apt-get install -y curl
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    rm:
      # Make sure no stale prebuilt blobs are present.
      - app/src/main/jniLibs
    prebuild:
      # Add Android targets + cargo-ndk, then build the Rust core.
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup target add aarch64-linux-android x86_64-linux-android
      - cargo install --locked cargo-ndk
      - cd ..
      - git clone --depth 1 --branch v0.1.0 https://github.com/TC4NS/sequred-identity-core.git core
      - cd core
      - cargo ndk -t arm64-v8a -t x86_64 -o ../android/app/src/main/jniLibs build --release
      # Regenerate the Kotlin bindings so they match the just-built core.
      - cargo run --bin uniffi-bindgen -- generate \
          --library target/aarch64-linux-android/release/libsequred_core.so \
          --language kotlin \
          --out-dir ../android/app/src/main/kotlin
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.1.0
CurrentVersionCode: 10000
