org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AGP 8.7 needs JDK 17 or 21. The system JDK is 25, which is too new and makes
# the build crash with "no enum constant JavaVersion.VERSION_25". Point Gradle
# at the JBR that Android Studio bundles, which is JDK 21.
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official
